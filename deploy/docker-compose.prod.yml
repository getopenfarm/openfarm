services:
  openfarm:
    image: ghcr.io/getopenfarm/openfarm:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./data:/data
    environment:
      - PGPASSWORD=            # Required: same value as POSTGRES_PASSWORD below
      - Jwt__SigningKey=       # Required: openssl rand -base64 48
      - Seed__AdminPassword=   # Required on first boot: log in as admin with this password
      # - TZ=Etc/UTC           # Log timestamps
      # - PUID=1000            # Set to $(id -u) to match your host user
      # - PGID=1000            # Set to $(id -g) to match your host group
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=openfarm
      - POSTGRES_PASSWORD=     # Required
    healthcheck:
      test: pg_isready -U openfarm
      interval: 5s
      retries: 10

volumes:
  pg_data:
