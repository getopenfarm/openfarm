services:
  openfarm:
    image: ghcr.io/getopenfarm/openfarm:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - data:/data
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql
    env_file: .env
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER
      interval: 5s
      retries: 10

volumes:
  data:
  postgres:
