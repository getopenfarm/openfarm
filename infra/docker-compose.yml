services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - openfarm_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Linux only: printer discovery listens for LAN broadcast/multicast (Bambu: UDP 2021/1990; Snapmaker U1:
    # mDNS, UDP 5353), which a bridged container never receives (Docker Desktop on macOS/Windows cannot do
    # this at all).
    # network_mode: host
    build:
      # Repo root, not api/ — the build now also needs tools/provision-slicers and the root
      # slicers.manifest.json (infra/docker/api.Dockerfile provisions the bundle at build time).
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      SlicerBundle__RootDirectory: /opt/slicers
      CameraSnapshotStorage__RootDirectory: /data/camera-snapshots
    ports:
      - "${API_HTTP_PORT}:8888"
    volumes:
      - ..:/src
      - openfarm_part_files:/data/part-files
      - openfarm_camera_snapshots:/data/camera-snapshots

  web:
    build:
      context: ../web
      dockerfile: ../infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ../web:/app
      - /app/node_modules

volumes:
  openfarm_pg_data:
  openfarm_part_files:
  openfarm_camera_snapshots:
