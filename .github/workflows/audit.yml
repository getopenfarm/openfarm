name: Audit

# Advisories are published without a code change, so a PR can go red for reasons its diff never touched.
# Checked weekly instead (scheduled runs only fire on the default branch); run it by hand any time.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - name: dotnet vulnerable packages
        run: |
          # Listing reports findings but does not fail the job. Restore enforces all severities.
          dotnet restore api/OpenFarm.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
          dotnet list api/OpenFarm.slnx package --vulnerable --include-transitive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: web
        # The single unpatched CLI-only exception is documented in docs/DEPENDENCY_AUDIT.md.
        run: bun install --frozen-lockfile && bun run audit
