name: Audit

# Advisories are published without a code change, so a PR can go red for reasons its diff never touched.
# Checked weekly instead (scheduled runs only fire on the default branch); run it by hand any time.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - name: dotnet vulnerable packages
        run: dotnet list api/OpenFarm.slnx package --vulnerable --include-transitive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: web
        run: bun install --frozen-lockfile && bun audit
