name: Website and documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "tools/build-site.sh"
      - "tools/check-site.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "tools/build-site.sh"
      - "tools/check-site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Build both sites and validate links
        run: bash tools/build-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openfarm-site
          path: site-dist/
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Check publishing credential
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Set PAGES_DEPLOY_TOKEN as described in website/README.md."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: openfarm-site
          path: built-site
      - name: Check out deployment repository
        uses: actions/checkout@v7
        with:
          repository: getopenfarm/getopenfarm.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-target
      - name: Publish generated files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude='.git/' built-site/ pages-target/
          cd pages-target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "Published files are already up to date."
            exit 0
          fi
          git commit -m "Publish openfarm ${SOURCE_SHA}"
          git push origin HEAD:main
