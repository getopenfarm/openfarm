name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # All three jobs below drive through the NUKE build (build/Build.cs via ./build.sh) instead of
  # separate ad hoc steps — the same targets a developer runs locally, standardizing testing and
  # slicer provisioning on one build definition (see build/Build.cs and quickstart.md).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Format check (dotnet format + Biome)
        run: ./build.sh FormatCheck FrontendLint

  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openfarm
          POSTGRES_PASSWORD: openfarm
          POSTGRES_DB: openfarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfarm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - name: Restore, build, and test
        run: ./build.sh Test
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=openfarm;Username=openfarm;Password=openfarm"
      # Migrations are applied for real as part of the Test step above: every
      # OpenFarm.Api.IntegrationTests fixture (CustomWebApplicationFactory) spins up
      # its own Testcontainers Postgres and runs the InitialFoundation migration
      # against it via Program.cs's startup Database.MigrateAsync() call.

  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Typecheck, test, build, and check for API-client drift
        run: ./build.sh FrontendTypecheck FrontendTest FrontendBuild FrontendContractDriftCheck

  e2e:
    if: false # STUB: no Playwright suite yet — no meaningful user flow to test against
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deferred until M1+ ships a real flow (create printer, etc.)"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - name: dotnet vulnerable packages
        run: dotnet list api/OpenFarm.slnx package --vulnerable --include-transitive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: web
        run: bun install --frozen-lockfile && bun audit
      - name: Gitleaks
        # Pinned to the last MIT-licensed release before v2.0.0 introduced a GITLEAKS_LICENSE
        # requirement (org/user-detection call to gitleaks.io, which itself started failing here) —
        # avoids depending on an external license server for a plain default-ruleset scan.
        uses: gitleaks/gitleaks-action@v1.6.0
