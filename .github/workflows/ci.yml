name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]
  workflow_call:

# A new push to a PR cancels its superseded run; main and release-tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - name: dotnet format check
        run: dotnet format api/OpenFarm.slnx --verify-no-changes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: bun install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Biome check
        working-directory: web
        run: bun run lint

  backend-build-test:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openfarm
          POSTGRES_PASSWORD: openfarm
          POSTGRES_DB: openfarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfarm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - name: Restore
        run: dotnet restore api/OpenFarm.slnx
      - name: Build
        run: dotnet build api/OpenFarm.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test api/OpenFarm.slnx --no-build --configuration Release
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=openfarm;Username=openfarm;Password=openfarm"
      # Migrations are applied for real as part of the Test step above: every
      # OpenFarm.Api.IntegrationTests fixture (CustomWebApplicationFactory) spins up
      # its own Testcontainers Postgres and runs the InitialFoundation migration
      # against it via Program.cs's startup Database.MigrateAsync() call.

  frontend-build-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bunx tsc -b
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bun run build
      - name: Orval contract-drift check
        working-directory: web
        run: bunx orval && git diff --exit-code src/lib/api/generated

  e2e:
    if: false # STUB: no Playwright suite yet — no meaningful user flow to test against
    runs-on: ubuntu-26.04
    steps:
      - run: echo "Deferred until M1+ ships a real flow (create printer, etc.)"

  # Dependency advisories land without a code change, so they run weekly in audit.yml, not on every PR.
  security:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        # The v7.4.0 image gitleaks-action@v1.6.0 wrapped, run directly: the action's entrypoint emits
        # deprecated set-output commands, and gitleaks-action v2 needs a GITLEAKS_LICENSE (an
        # org/user-detection call to gitleaks.io that failed here). Scans every commit on every ref.
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v7.4.0 --path=/repo --config-path=/repo/.github/.gitleaks.toml --verbose --redact
